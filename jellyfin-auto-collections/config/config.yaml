# Jellyfin Auto Collections Config
# Syncs lists from various sources into Jellyfin collections

crontab: !ENV ${CRONTAB}
timezone: !ENV ${TZ}

jellyfin:
  server_url: !ENV ${JELLYFIN_SERVER_URL}
  api_key: !ENV ${JELLYFIN_API_KEY}
  user_id: !ENV ${JELLYFIN_USER_ID}

plugins:
  # IMDb Charts - Top rated, box office, trending
  # 2026-06-12: disabled — IMDb scraper broken upstream (soup.find('title') -> None, crashes whole run)
  imdb_chart:
    enabled: false
    list_ids:
      - top           # IMDb Top 250
      - boxoffice     # Current box office
      - moviemeter    # Most popular movies
    clear_collection: true

  # Letterboxd Lists - Add your favorite lists here
  letterboxd:
    enabled: true
    imdb_id_filter: true  # Better matching but slower
    list_ids:
      # Your personal lists
      - szymonindy/list/obama-cinema
      - szymonindy/list/filmy-do-objerzenia-z-natalka
      - szymonindy/list/filmy-do-objerzenia-z-natalka-1
      - szymonindy/list/90s
      - szymonindy/list/the-war-zone
      - szymonindy/list/documentaries
      - szymonindy/list/legendary-90s
      - szymonindy/list/all-time-favourites
      # Popular curated lists
      # 2026-06-12: two lists 404 (renamed/deleted upstream) — tool crashes whole run on missing list, disabled:
      # - dave/list/official-top-250-narrative-feature-films
      # - gubarenko/list/1001-movies-you-must-see-before-you-die
      - fcbarcelona/list/movies-everyone-should-watch-at-least-once

  # They Shoot Pictures, Don't They? - Acclaimed films lists
  # 2026-06-12: disabled — scraper returns whitespace-padded titles, 0 matches (upstream bug)
  tspdt:
    enabled: false
    list_ids:
      - 1000-greatest-films

  # BFI (British Film Institute) curated lists
  # 2026-06-12: disabled — BFI site changed, "No JSON-LD metadata found" crashes whole run
  bfi:
    enabled: false
    list_ids:
      - sight-and-sound-greatest-films-of-all-time

  # Criterion Channel collections (if you want classic cinema)
  criterion_channel:
    enabled: false
    list_ids:
      - essential-art-house
      - film-noir

  # Trakt - disabled by default, needs API credentials
  trakt:
    enabled: false
    list_ids:
      - movies/trending
      - movies/popular
    client_id: YOUR_TRAKT_CLIENT_ID
    client_secret: YOUR_TRAKT_CLIENT_SECRET
